{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APEX — Iniciar sesión</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
  <main class="container" style="max-width: 380px">
    <h1 class="h4 fw-bold text-center mb-1">APEX</h1>
    <p class="text-center text-body-secondary small mb-4">Capital &amp; Intelligence</p>

    <div class="card bg-body-tertiary">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Iniciar sesión</h2>

        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
            <input type="text" class="form-control" name="{{ form.username.html_name }}"
                   id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}"
                   autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
            <input type="password" class="form-control" name="{{ form.password.html_name }}"
                   id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
